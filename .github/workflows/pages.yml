# Builds the BICROSS Navigator with Hexapla and publishes it on GitHub Pages.
# In the repository settings, set Pages → Source to "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: site
        uses: rbturnbull/hexapla@main  # use @v1 once Hexapla is tagged
        with:
          config: bicross-navigator-config.yaml
